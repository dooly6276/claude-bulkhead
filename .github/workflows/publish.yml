name: publish

# Publishing a GitHub release puts the same version on npm and attaches the Gemini CLI extension
# archive to the release. npm trusts this workflow (trusted publishing over OIDC), so no npm token
# is stored and no one has to approve a login on their phone.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      id-token: write # npm trusted publishing
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@11
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - name: Publish to npm
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "claude-bulkhead@$v" version >/dev/null 2>&1; then
            echo "claude-bulkhead@$v is already on npm"
          else
            npm publish --access public
          fi
      - name: Attach the Gemini extension archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-gemini-extension.js
          gh release upload "$TAG" bulkhead-gemini-extension.tar.gz --clobber
